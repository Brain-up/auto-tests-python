name: Initialize Allure History

on:
  workflow_dispatch:

# Добавлены права на запись, чтобы экшен мог сделать push
permissions:
  contents: write

jobs:
  init-allure:
    runs-on: ubuntu-24.04 # Зафиксировали версию, чтобы не было предупреждений
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Create basic structure
        run: |
          mkdir -p allure-history
          echo "# Allure Reports History" > allure-history/README.md
          date > allure-history/initialized.txt

      - name: Commit initial structure
        uses: peaceiris/actions-gh-pages@v4 # Обновлено с v2 до v4
        with:
          personal_token: ${{ secrets.CI_TOKEN }} # with и строчные буквы
          publish_branch: gh-pages
          publish_dir: ./allure-history # Публикуем только созданную папку
